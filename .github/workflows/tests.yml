name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
        env:
          MPLBACKEND: Agg

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e . -r docs/requirements.txt
      - run: sphinx-build -W --keep-going -b html . docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html


  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q -m integration tests/test_integration.py

  free-threaded:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14t'
      - run: python -m pip install -e '.[test]'
      - name: Check core tests without the GIL
        run: |
          python - <<'PY'
          import sys
          import pytest
          import xndbc
          assert not sys._is_gil_enabled(), 'A core dependency re-enabled the GIL'
          result = pytest.main(['-q', 'tests/test_api.py', 'tests/test_analysis.py', '-k', 'not map_layouts'])
          assert not sys._is_gil_enabled(), 'A dependency imported by the tests re-enabled the GIL'
          raise SystemExit(result)
          PY
